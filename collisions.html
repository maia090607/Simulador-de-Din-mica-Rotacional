<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Colisiones Espaciales 3D | Momento Lineal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090b;
      --panel-bg: rgba(24, 24, 27, 0.85);
      --border-color: #27272a;
      --text-main: #a1a1aa;
      --text-bright: #f4f4f5;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      width: 340px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .ui-overlay h2 {
      color: var(--text-bright);
      font-size: 16px;
      margin: 0 0 4px 0;
    }

    .ui-overlay p.desc {
      font-size: 11px;
      color: var(--text-main);
      margin: 0 0 16px 0;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-bright);
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    select, input[type="range"] {
      width: 100%;
      background: #18181b;
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      box-sizing: border-box;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #27272a; }
    .btn-secondary:hover { background: #3f3f46; }

    .telemetry-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      width: 340px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .telemetry-panel h3 {
      color: var(--text-bright);
      font-size: 12px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .back-link {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(12px);
    }
    .back-link:hover { border-color: var(--accent); }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">← Volver al Portal</a>

  <div id="canvas-container"></div>

  <!-- Panel de Control -->
  <div class="ui-overlay">
    <h2>Simulador de Colisiones 3D</h2>
    <p class="desc">Conservación de Momento Lineal ($\vec{p} = m\vec{v}$)</p>

    <div class="control-group">
      <label>Tipo de Colisión:</label>
      <select id="collisionType">
        <option value="elastic">Elástica (Rebote / e = 1.0)</option>
        <option value="inelastic">Inelástica (Acoplamiento / e = 0.0)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Masa Cuerpo A (Inercia): <span id="valMassA">10</span> kg</label>
      <input type="range" id="massA" min="2" max="50" value="10" step="1">
    </div>

    <div class="control-group">
      <label>Masa Cuerpo B (Inercia): <span id="valMassB">10</span> kg</label>
      <input type="range" id="massB" min="2" max="50" value="10" step="1">
    </div>

    <div class="control-group">
      <label>Velocidad Inicial: <span id="valSpeed">1.0</span>x</label>
      <input type="range" id="speedScale" min="0.2" max="3.0" value="1.0" step="0.1">
    </div>

    <div class="btn-row">
      <button class="btn" id="btnRestart">Reiniciar Impacto</button>
      <button class="btn btn-secondary" id="btnPause">Pausar</button>
    </div>
  </div>

  <!-- Panel de Telemetría -->
  <div class="telemetry-panel">
    <h3>Telemetría del Sistema</h3>
    <div class="telemetry-row"><span>Momento Inicial ($\vec{p}_0$):</span> <span id="pInit">0.00 kg·m/s</span></div>
    <div class="telemetry-row"><span>Momento Actual ($\vec{p}$):</span> <span id="pCurrent">0.00 kg·m/s</span></div>
    <div class="telemetry-row"><span>Estado de Impacto:</span> <span id="impactStatus" style="color:#3b82f6;">En trayectoria</span></div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x09090b);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 2.0, 100);
    pointLight.position.set(10, 20, 15);
    scene.add(pointLight);

    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 600;
    const starPositions = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 200;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({color: 0x52525b, size: 0.7});
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    let activeSparks = [];

    class SpaceObject {
      constructor(mesh, mass, radius, baseVelocity, position) {
        this.mesh = mesh;
        this.mass = mass;
        this.radius = radius;
        this.baseVelocity = baseVelocity;
        this.velocity = { ...baseVelocity };
        this.position = position;
        this.mesh.position.set(position.x, position.y, position.z);
      }

      update(dt, speedMultiplier) {
        this.velocity.x = this.baseVelocity.x * speedMultiplier;
        this.velocity.y = this.baseVelocity.y * speedMultiplier;
        this.velocity.z = this.baseVelocity.z * speedMultiplier;

        this.position.x += this.velocity.x * dt;
        this.position.y += this.velocity.y * dt;
        this.position.z += this.velocity.z * dt;
        this.mesh.position.set(this.position.x, this.position.y, this.position.z);
      }
    }

    let bodyA, bodyB;
    let isPaused = false;
    let initialMomentumMagnitude = 0;
    let hasCollided = false;

    function initSimulation() {
      if (bodyA) scene.remove(bodyA.mesh);
      if (bodyB) scene.remove(bodyB.mesh);
      hasCollided = false;

      const m1 = parseFloat(document.getElementById('massA').value);
      const m2 = parseFloat(document.getElementById('massB').value);

      const r1 = Math.cbrt(m1) * 0.6;
      const r2 = Math.cbrt(m2) * 0.6;

      const geoA = new THREE.SphereGeometry(r1, 32, 32);
      const matA = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.8 });
      const meshA = new THREE.Mesh(geoA, matA);
      scene.add(meshA);

      const geoB = new THREE.SphereGeometry(r2, 32, 32);
      const matB = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.4, metalness: 0.6 });
      const meshB = new THREE.Mesh(geoB, matB);
      scene.add(meshB);

      bodyA = new SpaceObject(meshA, m1, r1, { x: 4.0, y: 0, z: 0 }, { x: -12, y: 0, z: 0 });
      bodyB = new SpaceObject(meshB, m2, r2, { x: -3.0, y: 0, z: 0 }, { x: 12, y: 0, z: 0 });

      const currentSpeedScale = parseFloat(document.getElementById('speedScale').value);
      const pTotalX = bodyA.mass * (bodyA.baseVelocity.x * currentSpeedScale) + bodyB.mass * (bodyB.baseVelocity.x * currentSpeedScale);
      const pTotalY = bodyA.mass * (bodyA.baseVelocity.y * currentSpeedScale) + bodyB.mass * (bodyB.baseVelocity.y * currentSpeedScale);
      const pTotalZ = bodyA.mass * (bodyA.baseVelocity.z * currentSpeedScale) + bodyB.mass * (bodyB.baseVelocity.z * currentSpeedScale);
      initialMomentumMagnitude = Math.sqrt(pTotalX*pTotalX + pTotalY*pTotalY + pTotalZ*pTotalZ);

      document.getElementById('pInit').innerText = initialMomentumMagnitude.toFixed(2) + " kg·m/s";
      document.getElementById('impactStatus').innerText = "En trayectoria";
      document.getElementById('impactStatus').style.color = "#3b82f6";
    }

    initSimulation();

    function createImpactEffect(x, y, z) {
      const flashLight = new THREE.PointLight(0xffffff, 5.0, 15);
      flashLight.position.set(x, y, z);
      scene.add(flashLight);
      setTimeout(() => scene.remove(flashLight), 150);

      const sparkCount = 30;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const velocities = [];

      for (let i = 0; i < sparkCount; i++) {
        positions.push(x, y, z);
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const speed = 5 + Math.random() * 8;
        velocities.push({
          x: speed * Math.sin(phi) * Math.cos(theta),
          y: speed * Math.sin(phi) * Math.sin(theta),
          z: speed * Math.cos(phi)
        });
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({ color: 0xf59e0b, size: 0.4, transparent: true, opacity: 1.0 });
      const sparkSystem = new THREE.Points(geometry, material);
      scene.add(sparkSystem);

      activeSparks.push({ system: sparkSystem, velocities: velocities, life: 1.0 });
    }

    document.getElementById('massA').addEventListener('input', (e) => {
      document.getElementById('valMassA').innerText = e.target.value;
      initSimulation();
    });
    document.getElementById('massB').addEventListener('input', (e) => {
      document.getElementById('valMassB').innerText = e.target.value;
      initSimulation();
    });
    document.getElementById('speedScale').addEventListener('input', (e) => {
      document.getElementById('valSpeed').innerText = e.target.value;
    });
    document.getElementById('btnRestart').addEventListener('click', initSimulation);
    document.getElementById('btnPause').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('btnPause').innerText = isPaused ? "Reanudar" : "Pausar";
    });

    function checkCollisionAndResolve() {
      const dx = bodyB.position.x - bodyA.position.x;
      const dy = bodyB.position.y - bodyA.position.y;
      const dz = bodyB.position.z - bodyA.position.z;
      
      const distSq = dx*dx + dy*dy + dz*dz;
      const minDist = bodyA.radius + bodyB.radius;

      if (distSq <= minDist * minDist) {
        const dist = Math.sqrt(distSq);
        if (dist === 0) return;

        const nx = dx / dist;
        const ny = dy / dist;
        const nz = dz / dist;

        const rvx = bodyB.velocity.x - bodyA.velocity.x;
        const rvy = bodyB.velocity.y - bodyA.velocity.y;
        const rvz = bodyB.velocity.z - bodyA.velocity.z;

        const velAlongNormal = rvx * nx + rvy * ny + rvz * nz;
        
        if (velAlongNormal > 0) {
          hasCollided = false;
          return;
        }

        if (!hasCollided) {
          hasCollided = true;
          const contactX = bodyA.position.x + nx * bodyA.radius;
          const contactY = bodyA.position.y + ny * bodyA.radius;
          const contactZ = bodyA.position.z + nz * bodyA.radius;
          createImpactEffect(contactX, contactY, contactZ);
        }

        const mode = document.getElementById('collisionType').value;
        const m1 = bodyA.mass;
        const m2 = bodyB.mass;

        if (mode === 'inelastic') {
          const finalVx = (m1 * bodyA.velocity.x + m2 * bodyB.velocity.x) / (m1 + m2);
          const finalVy = (m1 * bodyA.velocity.y + m2 * bodyB.velocity.y) / (m1 + m2);
          const finalVz = (m1 * bodyA.velocity.z + m2 * bodyB.velocity.z) / (m1 + m2);

          bodyA.baseVelocity = { x: finalVx, y: finalVy, z: finalVz };
          bodyB.baseVelocity = { x: finalVx, y: finalVy, z: finalVz };

          document.getElementById('impactStatus').innerText = "Colisión Inelástica (Acoplados)";
          document.getElementById('impactStatus').style.color = "#eab308";
        } else {
          const restitution = 1.0;
          const impulseScalar = -(1 + restitution) * velAlongNormal / ((1 / m1) + (1 / m2));

          bodyA.baseVelocity.x -= (impulseScalar / m1) * nx;
          bodyA.baseVelocity.y -= (impulseScalar / m1) * ny;
          bodyA.baseVelocity.z -= (impulseScalar / m1) * nz;

          bodyB.baseVelocity.x += (impulseScalar / m2) * nx;
          bodyB.baseVelocity.y += (impulseScalar / m2) * ny;
          bodyB.baseVelocity.z += (impulseScalar / m2) * nz;

          document.getElementById('impactStatus').innerText = "Impacto Elástico (Rebote)";
          document.getElementById('impactStatus').style.color = "#22c55e";
        }

        // Corrección de posición con buffer para evitar atascos y rebotes erráticos
        const correction = (minDist - dist) + 0.05;
        bodyA.position.x -= nx * correction * (m2 / (m1 + m2));
        bodyA.position.y -= ny * correction * (m2 / (m1 + m2));
        bodyA.position.z -= nz * correction * (m2 / (m1 + m2));

        bodyB.position.x += nx * correction * (m1 / (m1 + m2));
        bodyB.position.y += ny * correction * (m1 / (m1 + m2));
        bodyB.position.z += nz * correction * (m1 / (m1 + m2));
      }
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const speedMultiplier = parseFloat(document.getElementById('speedScale').value);

      if (!isPaused) {
        bodyA.update(dt, speedMultiplier);
        bodyB.update(dt, speedMultiplier);
        checkCollisionAndResolve();

        const px = bodyA.mass * bodyA.velocity.x + bodyB.mass * bodyB.velocity.x;
        const py = bodyA.mass * bodyA.velocity.y + bodyB.mass * bodyB.velocity.y;
        const pz = bodyA.mass * bodyA.velocity.z + bodyB.mass * bodyB.velocity.z;
        const pCurrMag = Math.sqrt(px*px + py*py + pz*pz);

        document.getElementById('pCurrent').innerText = pCurrMag.toFixed(2) + " kg·m/s";
      }

      for (let i = activeSparks.length - 1; i >= 0; i--) {
        const spark = activeSparks[i];
        spark.life -= dt * 2.0;
        if (spark.life <= 0) {
          scene.remove(spark.system);
          activeSparks.splice(i, 1);
        } else {
          const positions = spark.system.geometry.attributes.position.array;
          for (let j = 0; j < spark.velocities.length; j++) {
            positions[j * 3] += spark.velocities[j].x * dt;
            positions[j * 3 + 1] += spark.velocities[j].y * dt;
            positions[j * 3 + 2] += spark.velocities[j].z * dt;
          }
          spark.system.geometry.attributes.position.needsUpdate = true;
          spark.system.material.opacity = spark.life;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
