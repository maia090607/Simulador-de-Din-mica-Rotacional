<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Colisiones Espaciales 3D | Avanzado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #09090b;
      --panel-bg: rgba(20, 20, 24, 0.95);
      --border-color: #27272a;
      --text-main: #a1a1aa;
      --text-bright: #f4f4f5;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      cursor: default;
    }

    #canvas-container.grabbing {
      cursor: grabbing;
    }

    /* Panel Izquierdo */
    .ui-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      width: 320px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      box-shadow: 0 12px 36px rgba(0,0,0,0.7);
    }

    .ui-overlay h2 {
      color: var(--text-bright);
      font-size: 14px;
      margin: 0 0 2px 0;
    }

    .ui-overlay p.desc {
      font-size: 10.5px;
      color: var(--text-main);
      margin: 0 0 10px 0;
    }

    .scrollable-controls {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 8px;
    }

    .scrollable-controls::-webkit-scrollbar {
      width: 4px;
    }
    .scrollable-controls::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .control-group {
      margin-bottom: 8px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-bright);
      margin-bottom: 3px;
      font-family: 'JetBrains Mono', monospace;
    }

    select, input[type="range"], input[type="text"], input[type="number"] {
      width: 100%;
      background: #18181b;
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      padding: 5px 7px;
      border-radius: 5px;
      font-size: 11px;
      outline: none;
      box-sizing: border-box;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-bright);
      cursor: pointer;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .checkbox-row input {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
    }

    .body-config-box {
      background: rgba(39, 39, 42, 0.4);
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 7px;
      margin-bottom: 8px;
    }

    .body-config-box h4 {
      margin: 0 0 6px 0;
      font-size: 11px;
      color: var(--text-bright);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .body-title-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 5px currentColor;
    }

    .input-slider-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }
    .input-slider-row input[type="number"] {
      width: 55px;
      text-align: center;
      padding: 3px;
      font-family: 'JetBrains Mono', monospace;
    }
    .input-slider-row input[type="range"] {
      flex: 1;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      padding: 7px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #27272a; }
    .btn-secondary:hover { background: #3f3f46; }
    
    .btn-small {
      background: #27272a;
      color: var(--text-bright);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-small:hover {
      background: #3f3f46;
      border-color: var(--accent);
    }

    .btn-danger { background: #ef4444; flex: 0 0 auto; padding: 2px 5px; font-size: 9.5px; border: none; border-radius: 4px; color: white; cursor: pointer;}
    .btn-danger:hover { background: #dc2626; }

    /* Columna Derecha General */
    .right-sidebar {
      position: absolute;
      top: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Telemetría (Arriba) */
    .telemetry-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.7);
    }

    .telemetry-panel h3 {
      color: var(--text-bright);
      font-size: 10.5px;
      margin: 0 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'Inter', sans-serif;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: var(--text-main);
      align-items: center;
    }

    /* Chat Gemini (Abajo) */
    .chatbot-panel {
      flex: 1;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0,0,0,0.7);
      overflow: hidden;
      min-height: 200px;
    }

    .chat-header {
      background: rgba(39, 39, 42, 0.4);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-header .status-dot {
      width: 5px;
      height: 5px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 5px #22c55e;
    }

    .chat-header span {
      color: var(--text-bright);
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 11px;
      line-height: 1.35;
    }

    .chat-bubble {
      background: #18181b;
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--text-bright);
      max-width: 92%;
      word-wrap: break-word;
      white-space: pre-line;
    }

    .chat-bubble.ai {
      border-left: 2px solid var(--accent);
      align-self: flex-start;
      background: rgba(24, 24, 27, 0.95);
    }

    .chat-bubble.user {
      background: #27272a;
      align-self: flex-end;
      border-right: 2px solid #3b82f6;
    }

    .chat-input-area {
      padding: 8px 10px;
      background: rgba(39, 39, 42, 0.4);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
    }

    .chat-input-area input {
      flex: 1;
      font-size: 11px;
      padding: 6px 8px;
    }

    .chat-input-area button {
      width: 60px;
      font-size: 10.5px;
      padding: 6px;
    }

    .back-link {
      position: absolute;
      top: 12px;
      right: 332px;
      z-index: 10;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      padding: 6px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      backdrop-filter: blur(14px);
    }
    .back-link:hover { border-color: var(--accent); }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">← Volver</a>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <h2>Simulador Multi-Cuerpo 3D</h2>
    <p class="desc">Física Interactiva Avanzada</p>

    <div class="control-group">
      <label>Coef. Restitución (e): <span id="valRestitution">1.0</span></label>
      <input type="range" id="restitutionScale" min="0.0" max="1.0" value="1.0" step="0.05">
    </div>

    <div class="control-group">
      <label>Velocidad Global: <span id="valSpeed">1.0</span>x</label>
      <input type="range" id="speedScale" min="0.2" max="3.0" value="1.0" step="0.1">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="chkGravity"> Gravedad Newtoniana Universal
    </label>
    
    <label class="checkbox-row">
      <input type="checkbox" id="chkVectors" checked> Mostrar Vectores Momento (vecp)
    </label>

    <button class="btn-small" id="btnAddBody">+ Añadir Cuerpo</button>

    <div class="scrollable-controls" id="bodiesContainer">
      </div>

    <div class="btn-row">
      <button class="btn" id="btnRestart">Reiniciar</button>
      <button class="btn btn-secondary" id="btnPause">Pausar</button>
    </div>
  </div>

  <div class="right-sidebar">
    <div class="telemetry-panel">
      <h3>Telemetría</h3>
      <div class="telemetry-row"><span>vecp0 Inicial:</span> <span id="pInit">0.00</span></div>
      <div class="telemetry-row"><span>vecp Actual:</span> <span id="pCurrent">0.00</span></div>
      <div class="telemetry-row"><span>Activos:</span> <span id="activeCount">3</span></div>
    </div>

    <div class="chatbot-panel">
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="status-dot"></div>
          <span>Tutor Gemini AI</span>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-bubble ai">
          ¡Hola! Simula colisiones elásticas e inelásticas, conserva el momento lineal y analiza los vectores en tiempo real.
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Escribe tu duda...">
        <button class="btn" id="sendBtn">Enviar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const GEMINI_API_KEY = "";

    let audioCtx = null;
    function playImpactSound(intensity) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150 + Math.min(intensity * 30, 400), audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);

      gain.gain.setValueAtTime(Math.min(intensity * 0.05, 0.4), audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x09090b);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 32);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 2.0, 100);
    pointLight.position.set(10, 20, 15);
    scene.add(pointLight);

    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 600;
    const starPositions = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 200;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({color: 0x52525b, size: 0.7});
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    let activeSparks = [];
    let bodies = [];
    let isPaused = false;
    let initialMomentumMagnitude = 0;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let draggedBody = null;
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const intersectionPoint = new THREE.Vector3();

    const colors = [0x3b82f6, 0x8b5cf6, 0xec4899, 0x22c55e, 0xf59e0b, 0x06b6d4];

    let bodiesConfig = [
      { mass: 10, posX: -12, posY: 0, posZ: 0, speed: 4.0, angle: 0 },
      { mass: 10, posX: 12, posY: 0, posZ: 0, speed: 3.0, angle: 180 },
      { mass: 5,  posX: 0, posY: 10, posZ: 0, speed: 3.5, angle: 270 }
    ];

    function renderBodiesUI() {
      const containerUI = document.getElementById('bodiesContainer');
      containerUI.innerHTML = '';
      document.getElementById('activeCount').innerText = bodiesConfig.length;

      bodiesConfig.forEach((b, index) => {
        const hexColor = '#' + colors[index % colors.length].toString(16).padStart(6, '0');
        const box = document.createElement('div');
        box.className = 'body-config-box';
        box.innerHTML = `
          <h4>
            <div class="body-title-left">
              <span class="color-dot" style="background-color: ${hexColor}; color: ${hexColor};"></span>
              <span>Cuerpo ${index + 1} (${b.mass} kg)</span>
            </div>
            ${bodiesConfig.length > 2 ? `<button class="btn-danger" onclick="removeBody(${index})">X</button>` : ''}
          </h4>
          <div class="control-group" style="margin-bottom:4px;">
            <label>Masa (kg):</label>
            <div class="input-slider-row">
              <input type="number" id="mInput_${index}" min="1" max="100" value="${b.mass}" onchange="updateBodyParam(${index}, 'mass', this.value)">
              <input type="range" id="mRange_${index}" min="2" max="40" value="${b.mass}" oninput="updateBodyParam(${index}, 'mass', this.value)">
            </div>
          </div>
          <div class="control-group" style="margin-bottom:4px;">
            <label>Velocidad (m/s):</label>
            <div class="input-slider-row">
              <input type="number" id="sInput_${index}" step="0.5" min="0" max="20" value="${b.speed}" onchange="updateBodyParam(${index}, 'speed', this.value)">
              <input type="range" id="sRange_${index}" min="0" max="10" step="0.5" value="${b.speed}" oninput="updateBodyParam(${index}, 'speed', this.value)">
            </div>
          </div>
          <div class="control-group" style="margin-bottom:0;">
            <label>Ángulo (°):</label>
            <div class="input-slider-row">
              <input type="number" id="aInput_${index}" min="0" max="360" value="${b.angle}" onchange="updateBodyParam(${index}, 'angle', this.value)">
              <input type="range" id="aRange_${index}" min="0" max="360" value="${b.angle}" oninput="updateBodyParam(${index}, 'angle', this.value)">
            </div>
          </div>
        `;
        containerUI.appendChild(box);
      });
    }

    window.updateBodyParam = function(index, param, val) {
      val = parseFloat(val);
      if (isNaN(val)) return;
      bodiesConfig[index][param] = val;

      const inputElem = document.getElementById(`${param[0]}Input_${index}`);
      const rangeElem = document.getElementById(`${param[0]}Range_${index}`);
      if(inputElem) inputElem.value = val;
      if(rangeElem) rangeElem.value = val;

      initSimulation();
    }

    window.removeBody = function(index) {
      if(bodiesConfig.length > 2) {
        bodiesConfig.splice(index, 1);
        renderBodiesUI();
        initSimulation();
      }
    }

    document.getElementById('btnAddBody').addEventListener('click', () => {
      if(bodiesConfig.length < 6) {
        const spawnAngle = Math.random() * Math.PI * 2;
        bodiesConfig.push({
          mass: 8,
          posX: Math.cos(spawnAngle) * 10,
          posY: Math.sin(spawnAngle) * 10,
          posZ: 0,
          speed: 3.0,
          angle: Math.floor(Math.random() * 360)
        });
        renderBodiesUI();
        initSimulation();
      }
    });

    function appendMessage(sender, text) {
      const chatContainer = document.getElementById('chatMessages');
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${sender}`;
      bubble.innerText = text;
      chatContainer.appendChild(bubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function queryGemini(promptText) {
      appendMessage('user', promptText);
      document.getElementById('userInput').value = '';

      const count = bodiesConfig.length;
      const restitution = document.getElementById('restitutionScale').value;
      const systemContext = `Eres un tutor experto en física mecánica. Cuerpos: ${count}, Coeficiente de restitución: ${restitution}. Responde claramente.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: systemContext + "\n\nMensaje: " + promptText }] }] })
        });

        const data = await response.json();
        if (!response.ok) {
          appendMessage('ai', 'Error de la API: Revisa tu clave API.');
          return;
        }

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          let aiResponse = data.candidates[0].content.parts[0].text.replace(/\*\*/g, '').replace(/\*/g, '');
          appendMessage('ai', aiResponse);
        } else {
          appendMessage('ai', 'Respuesta vacía.');
        }
      } catch (error) {
        appendMessage('ai', 'Error de conexión con Gemini.');
      }
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
      const text = document.getElementById('userInput').value.trim();
      if (text) queryGemini(text);
    });

    document.getElementById('userInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const text = document.getElementById('userInput').value.trim();
        if (text) queryGemini(text);
      }
    });

    class SpaceObject {
      constructor(mesh, mass, radius, baseVelocity, position, index, colorHex) {
        this.mesh = mesh;
        this.mass = mass;
        this.radius = radius;
        this.baseVelocity = baseVelocity;
        this.velocity = { ...baseVelocity };
        this.position = position;
        this.index = index;
        this.mesh.position.set(position.x, position.y, position.z);

        this.trailPoints = [];
        const trailGeo = new THREE.BufferGeometry();
        const trailMat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.4 });
        this.trailLine = new THREE.Line(trailGeo, trailMat);
        scene.add(this.trailLine);

        const dir = new THREE.Vector3(1, 0, 0);
        const origin = new THREE.Vector3(0, 0, 0);
        this.arrowHelper = new THREE.ArrowHelper(dir, origin, 1, colorHex, 0.4, 0.2);
        scene.add(this.arrowHelper);
      }

      update(dt, speedMultiplier, showVectors) {
        this.velocity.x = this.baseVelocity.x * speedMultiplier;
        this.velocity.y = this.baseVelocity.y * speedMultiplier;
        this.velocity.z = this.baseVelocity.z * speedMultiplier;

        this.position.x += this.velocity.x * dt;
        this.position.y += this.velocity.y * dt;
        this.position.z += this.velocity.z * dt;
        this.mesh.position.set(this.position.x, this.position.y, this.position.z);

        this.trailPoints.push(new THREE.Vector3(this.position.x, this.position.y, this.position.z));
        if (this.trailPoints.length > 60) this.trailPoints.shift();
        this.trailLine.geometry.setFromPoints(this.trailPoints);

        if (showVectors) {
          const pVector = new THREE.Vector3(this.mass * this.velocity.x, this.mass * this.velocity.y, this.mass * this.velocity.z);
          const pMag = pVector.length();
          if (pMag > 0.01) {
            this.arrowHelper.position.copy(this.position);
            this.arrowHelper.setDirection(pVector.clone().normalize());
            this.arrowHelper.setLength(Math.min(pMag * 0.15, 6), 0.4, 0.2);
            this.arrowHelper.visible = true;
          } else {
            this.arrowHelper.visible = false;
          }
        } else {
          this.arrowHelper.visible = false;
        }
      }

      destroy() {
        scene.remove(this.mesh);
        scene.remove(this.trailLine);
        scene.remove(this.arrowHelper);
      }
    }

    function initSimulation() {
      bodies.forEach(b => b.destroy());
      bodies = [];

      bodiesConfig.forEach((cfg, idx) => {
        const radius = Math.cbrt(cfg.mass) * 0.55;
        const colorVal = colors[idx % colors.length];
        const geo = new THREE.SphereGeometry(radius, 32, 32);
        const mat = new THREE.MeshStandardMaterial({ color: colorVal, roughness: 0.3, metalness: 0.8 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.userData = { id: idx };
        scene.add(mesh);

        const rad = cfg.angle * (Math.PI / 180);
        const vx = cfg.speed * Math.cos(rad);
        const vy = cfg.speed * Math.sin(rad);

        const baseVel = { x: vx, y: vy, z: 0 };
        const pos = { x: cfg.posX, y: cfg.posY, z: cfg.posZ };
        bodies.push(new SpaceObject(mesh, cfg.mass, radius, baseVel, pos, idx, colorVal));
      });

      const currentSpeedScale = parseFloat(document.getElementById('speedScale').value);
      let pTotalX = 0, pTotalY = 0, pTotalZ = 0;
      bodies.forEach(b => {
        pTotalX += b.mass * (b.baseVelocity.x * currentSpeedScale);
        pTotalY += b.mass * (b.baseVelocity.y * currentSpeedScale);
        pTotalZ += b.mass * (b.baseVelocity.z * currentSpeedScale);
      });
      initialMomentumMagnitude = Math.sqrt(pTotalX*pTotalX + pTotalY*pTotalY + pTotalZ*pTotalZ);
      document.getElementById('pInit').innerText = initialMomentumMagnitude.toFixed(2);
    }

    renderBodiesUI();
    initSimulation();

    window.addEventListener('pointerdown', (e) => {
      if (!isPaused) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const meshes = bodies.map(b => b.mesh);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        draggedBody = bodies.find(b => b.mesh === hitMesh);
        
        dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(dragPlane.normal).negate(), hitMesh.position);
        container.classList.add('grabbing');
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPaused || !draggedBody) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      if (raycaster.ray.intersectPlane(dragPlane, intersectionPoint)) {
        draggedBody.position.x = intersectionPoint.x;
        draggedBody.position.y = intersectionPoint.y;
        draggedBody.position.z = 0;
        draggedBody.mesh.position.copy(draggedBody.position);
        draggedBody.trailPoints = [];

        bodiesConfig[draggedBody.index].posX = intersectionPoint.x;
        bodiesConfig[draggedBody.index].posY = intersectionPoint.y;
      }
    });

    window.addEventListener('pointerup', () => {
      if (draggedBody) {
        draggedBody = null;
        container.classList.remove('grabbing');
      }
    });

    function createImpactEffect(x, y, z) {
      const flashLight = new THREE.PointLight(0xffffff, 4.0, 12);
      flashLight.position.set(x, y, z);
      scene.add(flashLight);
      setTimeout(() => scene.remove(flashLight), 120);

      const sparkCount = 20;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const velocities = [];

      for (let i = 0; i < sparkCount; i++) {
        positions.push(x, y, z);
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const speed = 4 + Math.random() * 6;
        velocities.push({
          x: speed * Math.sin(phi) * Math.cos(theta),
          y: speed * Math.sin(phi) * Math.sin(theta),
          z: speed * Math.cos(phi)
        });
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({ color: 0xf59e0b, size: 0.35, transparent: true, opacity: 1.0 });
      const sparkSystem = new THREE.Points(geometry, material);
      scene.add(sparkSystem);

      activeSparks.push({ system: sparkSystem, velocities: velocities, life: 1.0 });
    }

    document.getElementById('speedScale').addEventListener('input', (e) => {
      document.getElementById('valSpeed').innerText = e.target.value;
    });
    document.getElementById('restitutionScale').addEventListener('input', (e) => {
      document.getElementById('valRestitution').innerText = e.target.value;
    });
    document.getElementById('btnRestart').addEventListener('click', initSimulation);
    document.getElementById('btnPause').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('btnPause').innerText = isPaused ? "Reanudar" : "Pausar";
    });

    function applyGravity(dt) {
      const G = 15.0;
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const b1 = bodies[i];
          const b2 = bodies[j];

          const dx = b2.position.x - b1.position.x;
          const dy = b2.position.y - b1.position.y;
          const dz = b2.position.z - b1.position.z;
          const distSq = dx*dx + dy*dy + dz*dz + 1.0;
          const dist = Math.sqrt(distSq);

          const forceMagnitude = (G * b1.mass * b2.mass) / distSq;
          const fx = forceMagnitude * (dx / dist);
          const fy = forceMagnitude * (dy / dist);
          const fz = forceMagnitude * (dz / dist);

          b1.baseVelocity.x += (fx / b1.mass) * dt;
          b1.baseVelocity.y += (fy / b1.mass) * dt;
          b1.baseVelocity.z += (fz / b1.mass) * dt;

          b2.baseVelocity.x -= (fx / b2.mass) * dt;
          b2.baseVelocity.y -= (fy / b2.mass) * dt;
          b2.baseVelocity.z -= (fz / b2.mass) * dt;
        }
      }
    }

    function checkCollisions() {
      const restitution = parseFloat(document.getElementById('restitutionScale').value);

      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const b1 = bodies[i];
          const b2 = bodies[j];

          const dx = b2.position.x - b1.position.x;
          const dy = b2.position.y - b1.position.y;
          const dz = b2.position.z - b1.position.z;
          const distSq = dx*dx + dy*dy + dz*dz;
          const minDist = b1.radius + b2.radius;

          if (distSq <= minDist * minDist) {
            const dist = Math.sqrt(distSq);
            if (dist === 0) continue;

            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;

            const rvx = b2.velocity.x - b1.velocity.x;
            const rvy = b2.velocity.y - b1.velocity.y;
            const rvz = b2.velocity.z - b1.velocity.z;

            const velAlongNormal = rvx * nx + rvy * ny + rvz * nz;
            if (velAlongNormal > 0) continue;

            playImpactSound(Math.abs(velAlongNormal));
            createImpactEffect(b1.position.x + nx * b1.radius, b1.position.y + ny * b1.radius, b1.position.z + nz * b1.radius);

            const m1 = b1.mass;
            const m2 = b2.mass;

            const impulseScalar = -(1 + restitution) * velAlongNormal / ((1 / m1) + (1 / m2));

            b1.baseVelocity.x -= (impulseScalar / m1) * nx;
            b1.baseVelocity.y -= (impulseScalar / m1) * ny;
            b1.baseVelocity.z -= (impulseScalar / m1) * nz;

            b2.baseVelocity.x += (impulseScalar / m2) * nx;
            b2.baseVelocity.y += (impulseScalar / m2) * ny;
            b2.baseVelocity.z += (impulseScalar / m2) * nz;

            const correction = (minDist - dist) * 0.5;
            b1.position.x -= nx * correction; b1.position.y -= ny * correction; b1.position.z -= nz * correction;
            b2.position.x += nx * correction; b2.position.y += ny * correction; b2.position.z += nz * correction;
          }
        }
      }
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const speedMultiplier = parseFloat(document.getElementById('speedScale').value);
      const useGravity = document.getElementById('chkGravity').checked;
      const showVectors = document.getElementById('chkVectors').checked;

      if (!isPaused) {
        if (useGravity) {
          applyGravity(dt);
        }
        bodies.forEach(b => b.update(dt, speedMultiplier, showVectors));
        checkCollisions();

        let px = 0, py = 0, pz = 0;
        bodies.forEach(b => {
          px += b.mass * b.velocity.x;
          py += b.mass * b.velocity.y;
          pz += b.mass * b.velocity.z;
        });
        document.getElementById('pCurrent').innerText = Math.sqrt(px*px + py*py + pz*pz).toFixed(2);
      } else {
        bodies.forEach(b => b.update(0, 0, showVectors));
      }

      for (let i = activeSparks.length - 1; i >= 0; i--) {
        const spark = activeSparks[i];
        spark.life -= dt * 2.0;
        if (spark.life <= 0) {
          scene.remove(spark.system);
          activeSparks.splice(i, 1);
        } else {
          const positions = spark.system.geometry.attributes.position.array;
          for (let j = 0; j < spark.velocities.length; j++) {
            positions[j * 3] += spark.velocities[j].x * dt;
            positions[j * 3 + 1] += spark.velocities.y * dt;
            positions[j * 3 + 2] += spark.velocities.z * dt;
          }
          spark.system.geometry.attributes.position.needsUpdate = true;
          spark.system.material.opacity = spark.life;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
